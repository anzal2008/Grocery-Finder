services:
  - type: web
    name: grocery-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      # Values are set in the Render dashboard (never committed to the repo)
      - key: GEMINI_API_KEY
        sync: false
      - key: WAREHOUSE_ID
        sync: false
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_CLIENT_ID
        sync: false
      - key: DATABRICKS_CLIENT_SECRET
        sync: false
